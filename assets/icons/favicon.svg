<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e5d2"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <circle cx="16" cy="16" r="15" fill="#fdf7ee"/>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#e07a3f" stroke-width="1"/>

  <!-- 兔子头部组 -->
  <g filter="url(#softShadow)">
    <!-- 左耳外轮廓 -->
    <path d="M11.5 10 Q9 4 10.5 6 Q12 8 12.5 10" fill="none" stroke="#e07a3f" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 左耳内部 -->
    <path d="M11.5 10 Q10 6 10.8 8 Q11.5 9.5 12.2 10" fill="none" stroke="#f3e5d2" stroke-width="1" stroke-linecap="round"/>
    <!-- 右耳外轮廓 -->
    <path d="M20.5 10 Q23 4 21.5 6 Q20 8 19.5 10" fill="none" stroke="#e07a3f" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 右耳内部 -->
    <path d="M20.5 10 Q21 6 20.8 8 Q20 9.5 19.8 10" fill="none" stroke="#f3e5d2" stroke-width="1" stroke-linecap="round"/>

    <!-- 脸 -->
    <circle cx="16" cy="19.5" r="7.2" fill="url(#faceGrad)" stroke="#e07a3f" stroke-width="0.5"/>

    <!-- 眼睛（带高光） -->
    <circle cx="14.3" cy="18.6" r="0.8" fill="#46372a"/>
    <circle cx="14.1" cy="18.4" r="0.25" fill="#ffffff"/>
    <circle cx="17.7" cy="18.6" r="0.8" fill="#46372a"/>
    <circle cx="17.5" cy="18.4" r="0.25" fill="#ffffff"/>

    <!-- 鼻子 -->
    <path d="M15.4 19.9 Q16 20.5 16.6 19.9" fill="none" stroke="#ec8f8f" stroke-width="1" stroke-linecap="round"/>

    <!-- 嘴巴 -->
    <path d="M15.7 20.6 Q16 21.1 16.3 20.6" fill="none" stroke="#46372a" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>

    <!-- 腮红 -->
    <ellipse cx="12.3" cy="20.8" rx="1.7" ry="1.2" fill="#ec8f8f" opacity="0.6"/>
    <ellipse cx="19.7" cy="20.8" rx="1.7" ry="1.2" fill="#ec8f8f" opacity="0.6"/>

    <!-- 胡须 -->
    <path d="M13.2 20.4 Q11.2 20.4 10.2 20.4" fill="none" stroke="#8d7a6a" stroke-width="0.4" opacity="0.45"/>
    <path d="M18.8 20.4 Q20.8 20.4 21.8 20.4" fill="none" stroke="#8d7a6a" stroke-width="0.4" opacity="0.45"/>
  </g>
</svg>
