<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="小兔子与小狐狸 · 森林手记 分享缩略图">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="60%" stop-color="#fdf3e2"/>
      <stop offset="100%" stop-color="#f4e0c4"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="64%">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="100%" stop-color="#fae7cb"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e07a3f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e07a3f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e07a3f" stop-opacity="0"/>
