  <line x1="748" y1="104" x2="832" y2="104" stroke="#e0a06c" stroke-width="2" stroke-linecap="round"/>
  <text x="500" y="112" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" letter-spacing="6" fill="#b85c2a">FOREST NOTES · 森林手记</text>

