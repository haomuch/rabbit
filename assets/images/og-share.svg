  <text x="500" y="838" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Heiti SC, sans-serif" font-size="84" font-weight="800" letter-spacing="4" fill="#46372a">小兔子与小狐狸</text>
  <text x="500" y="896" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="600" letter-spacing="10" fill="#b85c2a">森林手记 · 四季之心</text>
  <text x="500" y="938" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" letter-spacing="2" fill="#9a836e">二十八天，把「最要好的朋友」写成别的什么</text>
